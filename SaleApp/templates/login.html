{%extends 'layout/base.html'%}

{%block title%}
    Dang Nhap
{%endblock%}

{%block content%}
<h3 class="text-center text-info ">&#127942 Dang Nhap</h3>
{% if er_m %}
  <div class="alert alert-danger">
      {{er_m}}
  </div>
{%endif%}
<form method="POST">
  <div class="mb-3 mt-3">
    <label for="username" class="form-label">Username:</label>
    <input class="form-control" id="username" placeholder="Enter username" name="username">
  </div>
  <div class="mb-3">
    <label for="pwd" class="form-label">Password:</label>
    <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
  </div>
  <div class="form-check mb-3">
    <label class="form-check-label">
      <input class="form-check-input" type="checkbox" name="remember"> Remember me
    </label>
  </div>
  <button type="submit" action="/login/username=<string:user>&pwd=<string:pss>"class="btn btn-primary">Submit</button>
</form>

{%endblock%}
